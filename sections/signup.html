<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<div class="modal-backdrop-custom d-none" id="contents">
    <div class="modal-card rounded-4 p-5 shadow-lg border border-secondary border-opacity-25"
        style="background-color: #363636; max-width: 650px; width: 90%;">

        <div
            class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
            <div>
                <h3 class="fs-3 fw-extrabold m-0 text-white tracking-tight">Create Account</h3>
                <p class="text-white small m-0 mt-1">Join HomeTutor to start connecting with top educators</p>
            </div>
            <button type="button"
                class="btn-close btn-close-white p-2 rounded-circle border border-secondary border-opacity-70"
                id="close" aria-label="Close"></button>
        </div>

        <!-- Form Layout -->
        <form id="teachers" class="row g-4">
            <div class="col-12">
                <label for="name" class="form-label text-white fw-semibold small text-uppercase tracking-wider">Full
                    Name</label>
                <input type="text" id="name" class="form-control custom-input text-white py-2 px-3"
                    placeholder="John Doe" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <div class="col-md-6">
                <label for="email"
                    class="form-label text-white fw-semibold small text-uppercase tracking-wider">Email
                    Address</label>
                <input type="email" id="email" class="form-control custom-input text-white py-2 px-3"
                    placeholder="john@example.com" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <div class="col-md-6">
                <label for="phoneNo"
                    class="form-label text-white fw-semibold small text-uppercase tracking-wider">Phone
                    Number</label>
                <input type="tel" id="phoneNo" class="form-control custom-input text-white py-2 px-3"
                    placeholder="+1 234 567 890" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <div class="col-12">
                <label for="address"
                    class="form-label text-white fw-semibold small text-uppercase tracking-wider">Physical
                    Address</label>
                <input type="text" id="address" class="form-control custom-input text-white py-2 px-3"
                    placeholder="City, Street address" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <div class="col-md-6">
                <label for="password"
                    class="form-label text-white fw-semibold small text-uppercase tracking-wider">Password</label>
                <input type="password" id="password" class="form-control custom-input text-white py-2 px-3"
                    placeholder="••••••••" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <div class="col-md-6">
                <label for="passwordC"
                    class="form-label text-white fw-semibold small text-uppercase tracking-wider">Confirm
                    Password</label>
                <input type="password" id="passwordC" class="form-control custom-input text-white py-2 px-3"
                    placeholder="••••••••" required>
                <small class="error-msg text-danger d-block mt-1"></small>
            </div>

            <!-- Submit Button Area -->
            <div class="col-12 mt-5">
                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold py-3 fs-5 shadow" id="submission"
                    style="border-radius: 12px; background: linear-gradient(45deg, #ffca28, #ffb300);">
                    Register Account
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    (() => {
        const signupForm = document.getElementById('teachers');
        const signupModal = document.getElementById('contents');
        const loginModal = document.getElementById('containerTwo');
        const closeBtn = document.getElementById('close');

        function showError(input, message) {
            const field = input.parentElement;
            const small = field.querySelector('.error-msg');
            if (small) small.innerText = message;
            input.classList.add('border-danger');
        }

        function clearErrors() {
            document.querySelectorAll('.error-msg').forEach(small => small.innerText = '');
            document.querySelectorAll('.custom-input').forEach(input => input.classList.remove('border-danger'));
        }

        closeBtn?.addEventListener('click', () => {
            signupModal?.classList.add('d-none');
        });

        signupForm?.addEventListener('submit', function (e) {
            e.preventDefault();
            clearErrors();

            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const phoneNo = document.getElementById('phoneNo');
            const address = document.getElementById('address');
            const password = document.getElementById('password');
            const passwordC = document.getElementById('passwordC');

            if (password.value !== passwordC.value) {
                showError(passwordC, 'Passwords do not match');
                return;
            }

            localStorage.setItem("name", name.value);
            localStorage.setItem("email", email.value);
            localStorage.setItem("phoneNo", phoneNo.value);
            localStorage.setItem("address", address.value);
            localStorage.setItem("password", password.value);

            alert("Registration successful! Please login to continue.");

            signupModal?.classList.add('d-none');
            loginModal?.classList.remove('d-none');
            signupForm.reset();
        });
    })();
</script>

</html>
