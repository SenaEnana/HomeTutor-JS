<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section id="contact" class="contact-section py-5 bg-light text-dark">
        <div class="container py-4">
            <div class="row justify-content-center text-center mb-5">
                <div class="col-lg-8">
                    <h2 class="display-5 fw-bold text-dark">Contact Us</h2>
                    <p class="lead text-warning fw-semibold">Reach Out For Any Additional Information</p>
                    <div class="mx-auto bg-warning" style="height: 3px; width: 60px;"></div>
                </div>
            </div>

            <div class="row g-4 justify-content-center">
                <!-- Contact Card: Phone -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100">
                        <div class="mb-3">
                            <!-- Swapped to Bootstrap Telephone Icon -->
                            <i class="bi bi-telephone-fill text-warning display-5"></i>
                        </div>
                        <h3 class="fs-5 fw-bold text-dark">Call Us</h3>
                        <p class="fs-6 text-secondary mb-0">0987645202</p>
                    </div>
                </div>

                <!-- Contact Card: Email -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100">
                        <div class="mb-3">
                            <!-- Swapped to Bootstrap Envelope Icon -->
                            <i class="bi bi-envelope-fill text-warning display-5"></i>
                        </div>
                        <h3 class="fs-5 fw-bold text-dark">Email Us</h3>
                        <p class="fs-6 text-secondary mb-0">senaenanu@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
