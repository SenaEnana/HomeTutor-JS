<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTutor - Connect Students & Tutors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
    </style>
</head>

<body>

    <header class="sticky-top shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-warning" href="#hero-container">
                    <i class="bi bi-mortarboard-fill me-2"></i>HomeTutor
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto me-4 mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active fs-5" href="#hero-container">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="#about-container">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="#services-container">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="#contact-container">Contact Us</a>
                        </li>
                    </ul>

                    <div id="register-actions" class="d-flex gap-2">
                        <button class="btn btn-outline-warning text-white px-4" id="sign">Login</button>
                        <button class="btn btn-warning fw-semibold px-4" id="signup">Sign Up</button>
                    </div>
                    <div id="profiles-actions" class="d-none flex-wrap gap-2"></div>
                </div>
            </div>
        </nav>
    </header>

    <!-- App View Shell Slots -->
    <section id="hero-container"></section>
    <section id="about-container"></section>
    <section id="services-container"></section>
    <section id="contact-container"></section>
    
    <!-- Modal Injections Target Areas -->
    <div id="signup-modal-holder"></div>
    <div id="login-modal-holder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Custom dynamic script evaluator for fetched modules
        async function loadSection(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                
                const targetElement = document.getElementById(elementId);
                if (targetElement) {
                    targetElement.innerHTML = html;
                    
                    // Manually run any embedded scripts inside the loaded fragment
                    const scripts = targetElement.querySelectorAll("script");
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement("script");
                        newScript.text = oldScript.text;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Load base layouts
            loadSection('hero-container', 'sections/hero.html');
            loadSection('about-container', 'sections/about.html');
            loadSection('services-container', 'sections/services.html');
            loadSection('contact-container', 'sections/contact.html');

            // Load interactive system fragments
            loadSection('signup-modal-holder', 'sections/signup.html');
            loadSection('login-modal-holder', 'sections/login.html');

            // Show Signup Modal Click Event Setup
            document.getElementById('signup')?.addEventListener('click', () => {
                const modal = document.getElementById('contents');
                if (modal) {
                    modal.classList.remove('d-none');
                } else {
                    console.error("Signup modal markup structure not loaded into DOM tree yet.");
                }
            });

            // Show Login Modal Click Event Setup
            document.getElementById('sign')?.addEventListener('click', () => {
                const modal = document.getElementById('containerTwo');
                if (modal) {
                    modal.classList.remove('d-none');
                } else {
                    console.error("Login modal markup structure not loaded into DOM tree yet.");
                }
            });
        });
    </script>
</body>

</html>
