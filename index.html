<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTutor - Connect Students & Tutors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
    </style>
</head>

<body>

    <header class="sticky-top shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-warning" href="#hero-container">
                    <i class="bi bi-mortarboard-fill me-2"></i>HomeTutor
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto me-4 mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active fs-5" href="#hero-container">Home</a></li>
                        <li class="nav-item"><a class="nav-link fs-5" href="#about-container">About Us</a></li>
                        <li class="nav-item"><a class="nav-link fs-5" href="#services-container">Services</a></li>
                        <li class="nav-item"><a class="nav-link fs-5" href="#contact-container">Contact Us</a></li>
                    </ul>

                    <div id="register-actions" class="d-flex gap-2">
                        <button class="btn btn-outline-warning text-white px-4" id="sign">Login</button>
                        <button class="btn btn-warning fw-semibold px-4" id="signup">Sign Up</button>
                    </div>
                    <div id="profiles-actions" class="d-none flex-wrap gap-2"></div>
                </div>
            </div>
        </nav>
    </header>

    <section id="hero-container"></section>
    <section id="about-container"></section>
    <section id="services-container"></section>
    <section id="contact-container"></section>

    <div id="signup-modal-holder"></div>
    <div id="login-modal-holder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let slideIndex = 0;
        function showSlides() {
            const slides = document.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }
            if (slides.length > 0) { slides[slideIndex - 1].style.display = "block"; }
            setTimeout(showSlides, 3500);
        }

        // Section Loader Engine
        async function loadSection(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            // Load all landing layouts concurrently
            await Promise.all([
                loadSection('hero-container', 'sections/hero.html'),
                loadSection('about-container', 'sections/about.html'),
                loadSection('services-container', 'sections/services.html'),
                loadSection('contact-container', 'sections/contact.html'),
                loadSection('signup-modal-holder', 'sections/signup.html'),
                loadSection('login-modal-holder', 'sections/signin.html')
            ]);

            // Initialize background sliders once hero layout components drop in
            showSlides();

            // Bind Event Handlers safely using dynamic delegation
            document.body.addEventListener('click', (e) => {
                const loginModal = document.getElementById('containerTwo');
                const signupModal = document.getElementById('contents');

                // Trigger Open Overlays
                if (e.target.id === 'sign') loginModal?.classList.remove('d-none');
                if (e.target.id === 'signup' || e.target.id === 'hero-signup') signupModal?.classList.remove('d-none');

                // Trigger Close Elements
                if (e.target.id === 'closebtn' || e.target === loginModal) loginModal?.classList.add('d-none');
                if (e.target.id === 'close' || e.target === signupModal) signupModal?.classList.add('d-none');
            });

            // Login Operations Event Hook
            document.body.addEventListener('submit', function (e) {
                if (e.target.id === 'students') {
                    e.preventDefault();
                    const emailVal = document.getElementById('emails').value;
                    const passVal = document.getElementById('passwords').value;

                    if (emailVal === localStorage.getItem("email") && passVal === localStorage.getItem("password")) {
                        localStorage.setItem('Are you active', 'true');
                        window.location.href = "additional.html";
                    } else {
                        alert("Invalid email or password!");
                    }
                }
            });

            // Global Account Session Verification Sequence
            const registerActions = document.getElementById('register-actions');
            const profilesActions = document.getElementById('profiles-actions');
            if (localStorage.getItem('Are you active') === "true") {
                registerActions.classList.add('d-none');
                profilesActions.classList.remove('d-none');
                profilesActions.innerHTML = `
                    <a href="profile.html" class="btn btn-warning fw-semibold">Profile</a>
                    <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
                `;

                document.getElementById('logoutBtn')?.addEventListener('click', () => {
                    localStorage.setItem('Are you active', 'false');
                    window.location.reload();
                });
            }
        });
    </script>
</body>

</html>
