<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTutor - Connect Students & Tutors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="sticky-top shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-warning" href="index.html">
                    <i class="bi bi-mortarboard-fill me-2"></i>HomeTutor
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto me-4 mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active fs-5" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="sections/about.html">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="sections/services.html">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="sections/contact.html">Contact Us</a>
                        </li>
                    </ul>
                    <div id="register-actions" class="d-flex gap-2">
                        <button class="btn btn-outline-warning text-white px-4" id="sign">Login</button>
                        <button class="btn btn-warning fw-semibold px-4" id="signup">Sign Up</button>
                    </div>
                    <div id="profiles-actions" class="d-none flex-wrap gap-2">
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div id="hero-container"></div>
    <div id="about-container"></div>
    <div id="services-container"></div>
    <div id="contact-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function loadSection(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }
        loadSection('hero-container', 'sections/hero.html');
        loadSection('about-container', 'sections/about.html');
        loadSection('services-container', 'sections/services.html');
        loadSection('contact-container', 'sections/contact.html');
    </script>
</body>
</html>
