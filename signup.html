<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTutor - Connect Students & Tutors</title>
    <!-- Font Awesome 6 (Updated from 4.7) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <main>

        <!-- Sign Up Modal Container -->
        <!-- Sign Up Modal Container -->
        <div class="modal-backdrop-custom d-none" id="contents">
            <div class="modal-card bg-dark text-white rounded-4 p-4 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
                    <h3 class="fs-4 fw-bold m-0">Create Account</h3>
                    <button type="button" class="btn-close btn-close-white" id="close" aria-label="Close"></button>
                </div>
                <form id="teachers" class="row g-3">
                    <div class="col-12">
                        <label for="name" class="form-label text-light">Full Name</label>
                        <input type="text" id="name" class="form-control bg-secondary text-white border-0"
                            placeholder="John Doe" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-light">Email</label>
                        <input type="email" id="email" class="form-control bg-secondary text-white border-0"
                            placeholder="john@example.com" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="phoneNo" class="form-label text-light">Phone Number</label>
                        <input type="tel" id="phoneNo" class="form-control bg-secondary text-white border-0"
                            placeholder="+1234567890" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-12">
                        <label for="address" class="form-label text-light">Address</label>
                        <input type="text" id="address" class="form-control bg-secondary text-white border-0"
                            placeholder="City, Street address" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label text-light">Password</label>
                        <input type="password" id="password" class="form-control bg-secondary text-white border-0"
                            placeholder="••••••••" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="passwordC" class="form-label text-light">Confirm Password</label>
                        <input type="password" id="passwordC" class="form-control bg-secondary text-white border-0"
                            placeholder="••••••••" required>
                        <small class="error-msg text-danger d-block mt-1"></small>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold rounded-pill"
                            id="submission">Register</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            // Registration Logic Isolation
            document.addEventListener("DOMContentLoaded", () => {
                const signupForm = document.getElementById('teachers');
                const signupModal = document.getElementById('contents');
                const loginModal = document.getElementById('containerTwo');

                function showError(input, message) {
                    const field = input.parentElement;
                    const small = field.querySelector('.error-msg');
                    if (small) small.innerText = message;
                }

                function clearErrors() {
                    document.querySelectorAll('.error-msg').forEach(small => small.innerText = '');
                }

                signupForm?.addEventListener('submit', function (e) {
                    e.preventDefault();
                    clearErrors();

                    const name = document.getElementById('name');
                    const email = document.getElementById('email');
                    const phoneNo = document.getElementById('phoneNo');
                    const address = document.getElementById('address');
                    const password = document.getElementById('password');
                    const passwordC = document.getElementById('passwordC');

                    // Validation check
                    if (password.value !== passwordC.value) {
                        showError(passwordC, 'Passwords do not match');
                        return;
                    }

                    // Save variables to LocalStorage
                    localStorage.setItem("name", name.value);
                    localStorage.setItem("email", email.value);
                    localStorage.setItem("phoneNo", phoneNo.value);
                    localStorage.setItem("address", address.value);
                    localStorage.setItem("password", password.value);

                    alert("Registration successful! Please login to continue.");

                    // UI State Transitions
                    signupModal?.classList.add('d-none');
                    loginModal?.classList.remove('d-none');
                    signupForm.reset();
                });
            });
        </script>
</body>

</html>
